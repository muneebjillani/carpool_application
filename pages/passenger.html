<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HumSafar - Find Rides (Passenger)</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/home.css" />
    <link rel="stylesheet" href="../css/rides.css" />
  </head>
  <body>
    <main class="screen rides-screen">
      <div class="fixed-search-container">
        <header class="header home-header">
          <h1 class="brand">Find Rides</h1>
          <a href="./home.html" class="back-link">🏠</a>
        </header>

        <form class="search-form">
          <div class="field">
            <input type="text" placeholder="From (e.g., LDA)" />
          </div>
          <div class="field">
            <input type="text" placeholder="To (e.g., EME)" />
          </div>
          <div class="field"><input type="date" /></div>
          <button type="submit" class="btn btn-find-ride">Find Ride</button>
        </form>
      </div>

      <div class="scrollable-rides-container">
        <div class="ride-card">
          <div class="ride-schedule-row">
            <div class="time-locations">
              <div class="time-loc-item">
                <span class="time">10:00 AM</span
                ><span class="location">LDA</span>
              </div>
              <div class="time-loc-item">
                <span class="time">11:00 AM</span
                ><span class="location">EME</span>
              </div>
            </div>
            <div class="price-tag">Rs. 350</div>
          </div>
          <div class="ride-footer-row">
            <div class="user-info">
              <div class="avatar-circle">A</div>
              <div class="user-details">
                <h4>Ahmed</h4>
                <span class="rating">★ 4.8</span>
              </div>
            </div>
            <button
              class="btn-action-ride"
              onclick="alert('Ride request sent!')"
            >
              Request
            </button>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
