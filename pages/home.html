<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HumSafar</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/home.css" />
    <link rel="stylesheet" href="../css/navbar.css" />
    <script src="../js/home.js" defer></script>
  </head>
  <body>
    <main class="screen">
      <header class="header home-header">
        <h1 class="brand">HumSafar</h1>
        <button class="menu-btn" id="menuBtn" aria-label="Open Menu">☰</button>
      </header>
      <p class="menu-Btn-content">Find a Ride, as</p>
      <section class="mode-selector" aria-label="Mode selection">
        <button class="mode-card passenger-card" id="passengerModeBtn">
          Passenger
        </button>
        <button class="mode-card driver-card" id="driverModeBtn">Driver</button>
      </section>

      <section class="dashboard-content">
        <div class="reward-card">
          <h2>REWARD</h2>
          <p class="reward-subtitle">Earn points on every shared ride!</p>
        </div>
      </section>

      <nav class="bottom-nav">
        <a href="./home.html" class="nav-item active">
          <span class="nav-icon">🏠</span>
          <span class="nav-label">Home</span>
        </a>
        <a href="./message.html" class="nav-item">
          <span class="nav-icon">💬</span>
          <span class="nav-label">Messages</span>
        </a>
        <a href="./ride.html" class="nav-item">
          <span class="nav-icon">🚗</span>
          <span class="nav-label">Rides</span>
        </a>
        <a href="./profile.html" class="nav-item">
          <span class="nav-icon">👤</span>
          <span class="nav-label">Profile</span>
        </a>
      </nav>
    </main>
  </body>
</html>
