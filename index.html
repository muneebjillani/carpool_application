<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HumSafar</title>
    <link rel="stylesheet" href="./css/style.css" />
    <script src="./js/main.js" defer></script>
  </head>
  <!--hello-->
  <body>
    <main class="landing-screen">
      <header class="header">
        <div class="logo" aria-hidden="true">LOGO</div>
        <h1 class="brand">HumSafar</h1>
      </header>
      <section class="hero" aria-label="How HumSafar works">
        <div class="road"></div>
        <div class="car car-a" id="carA"></div>
        <div class="car car-b" id="carB"></div>
        <p class="hero-caption">Animation goes here</p>
      </section>
      <section class="tagline">
        <div>
          <p>Same route</p>
          <p>Share the ride</p>
        </div>
        <div class="additional-text">
          <p>Travel together, split the fuel.</p>
        </div>
      </section>
      <nav class="actions">
        <button class="btn btn-login" id="loginBtn">Login</button>
        <button class="btn btn-create-account" id="createBtn">
          Create account
        </button>
      </nav>
    </main>
  </body>
</html>
